<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cowworker — Поиск коворкингов</title>
  <!-- Подключение Bulma (CSS-фреймворк) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <!-- Иконки -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles/custom.css">
</head>
<body>
  <!-- Пока пусто. Мы будем заполнять блоками по карте сайта -->
  <section class="section has-text-centered">
    <h1 class="title">Проект запущен ✅</h1>
    <p class="subtitle">Теперь можно открывать через Live Server и начинать вёрстку.</p>
  </section>

  <!-- Скрипт для мобильного меню (нужен Bulma) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const burgers = document.querySelectorAll('.navbar-burger');
      burgers.forEach(el => {
        el.addEventListener('click', () => {
          const target = el.dataset.target;
          document.getElementById(target).classList.toggle('is-active');
          el.classList.toggle('is-active');
        });
      });
    });
  </script>
</body>
</html>
